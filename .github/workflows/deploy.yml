name: Deploy

on:
  push:
    branches: [main]
    # Files that cannot affect the built site. Must stay an explicit list:
    # a blanket '**.md' would match blog posts under src/content/ and silently
    # skip the deploy that publishes them.
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - '.gitignore'
      - '.vscode/**'
      - '.claude/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
