version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which cannot pick up patches on
  # their own. Without this, the pins silently rot — Dependabot is what makes
  # SHA pinning maintainable rather than worse than tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    groups:
      # Astro core and its first-party integrations move together; separate PRs
      # for each would conflict and need manual sequencing.
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
    ignore:
      # @astrojs/check 0.9.10 — its latest — declares
      # peer typescript "^5.0.0 || ^6.0.0", so TypeScript 7 fails npm ci with
      # ERESOLVE before any code runs. There is no newer @astrojs/check to
      # pair with it, so no version combination resolves.
      # Remove this once it supports 7:
      #   npm view @astrojs/check@latest peerDependencies
      - dependency-name: typescript
        versions: ['>=7']
